<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue | Resolve Public Problems</title>
    <!-- Fonts & Bootstrap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-accent: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #0f172a;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }

        .form-control, .form-select {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 0.75rem 1rem;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 14px;
            font-weight: 600;
            box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
        }
        .btn-gradient:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>
    <nav class="navbar glass-nav sticky-top">
        <div class="container py-1">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" href="/">
                <span class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-2" style="width: 36px; height: 36px; background: var(--primary-gradient) !important;">
                    <i class="bi bi-shield-check"></i>
                </span>
                <span style="letter-spacing: -0.5px;">Resolve Public <span style="color: #818cf8;">Problems</span></span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3 py-1">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(99, 102, 241, 0.1); color: #4f46e5;">
                            <i class="bi bi-send-plus fs-2"></i>
                        </div>
                        <h3 class="fw-bold" style="letter-spacing: -0.5px;">Report a Problem</h3>
                        <p class="text-muted small">Submit your civic or infrastructure issue for prompt action.</p>
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Full Name</label>
                            <input type="text" name="complainant_name" class="form-control" placeholder="e.g., Alex Johnson" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Problem Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g., Broken streetlight near Park gate" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Department / Category</label>
                            <select name="category" class="form-select" required>
                                <option value="" selected disabled>Select relevant department</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Detailed Description</label>
                            <textarea name="description" rows="4" class="form-control" placeholder="Provide full details, landmark/location, or severity..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Supporting Photo / Proof (Optional)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-gradient w-100">
                            Submit for Resolution
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
