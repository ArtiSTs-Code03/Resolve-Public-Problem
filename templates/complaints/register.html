<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Citizen Report Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
        }
        .form-control {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 0.75rem 1rem;
        }
        .helptext {
            font-size: 0.75rem;
            color: #64748b;
            display: block;
            margin-top: 4px;
        }
        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <div class="glass-card p-4 p-md-5 m-3">
        <div class="text-center mb-4">
            <span class="d-inline-flex align-items-center justify-content-center text-white rounded-3 p-3 mb-2" style="background: var(--primary-gradient);">
                <i class="bi bi-person-plus-fill fs-3"></i>
            </span>
            <h4 class="fw-bold mt-2">New Citizen Account</h4>
            <p class="text-muted small">Register to track and report issues</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small rounded-3">
                {% for field in form %}
                    {% for error in field.errors %}
                        <div>• {{ error }}</div>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password1" class="form-control" placeholder="Create strong password" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                <input type="password" name="password2" class="form-control" placeholder="Repeat password" required>
            </div>

            <button type="submit" class="btn btn-gradient w-100">Create Account</button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="small text-muted mb-0">Already registered? <a href="/login/" class="text-primary fw-semibold text-decoration-none">Log in here</a></p>
        </div>
    </div>
</body>
</html>
